# Connection to Docker Oracle (service name from docker-compose)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

# Driver (auto-detected, but explicit for clarity)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialect for Oracle 23c Free
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Dev process & first init (add these)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=ALWAYS

# Pool for Docker reliability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Use your schema (sdmdev01)
#spring.jpa.properties.hibernate.default_schema=SDMDEV01
