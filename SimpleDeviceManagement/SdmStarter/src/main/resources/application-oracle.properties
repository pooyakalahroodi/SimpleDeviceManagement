# Oracle (PDB-Name in URL anpassen, falls nötig)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1?oracle.jdbc.timezoneAsRegion=false
spring.datasource.username=sdmdev01
spring.datasource.password=tyKul25

# Driver (auto-detected, but explicit for clarity)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialect for Oracle 23c Free
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Dev process & first init (add these)
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.defer-datasource-initialization=true
# spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=ALWAYS
spring.sql.init.schema-locations=classpath:sql/oracle/schema.sql
spring.sql.init.data-locations=classpath:sql/oracle/data.sql
# spring.sql.init.separator=;
spring.sql.init.continue-on-error=true
spring.sql.init.separator=/

# Pool for Docker reliability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

